<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>All American Life Search</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AAL Search"><meta name="theme-color" content="#1a73e8">
<style>body{font-family:system-ui;max-width:420px;margin:40px auto;padding:0 16px}input,button{font-size:20px;width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#1a73e8;color:#fff;border:0;border-radius:8px}</style></head>
<body><h2>All American Life Search</h2><form id="f"><input id="n" type="tel" placeholder="(407) 555-1234" autofocus><button>Search TruePeopleSearch</button></form>
<script>f.onsubmit=e=>{e.preventDefault();const d=n.value.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');if(d.length!==10){alert('Enter a 10-digit number');return}
const p=`(${d.slice(0,3)})${d.slice(3,6)}-${d.slice(6)}`;window.open('https://www.truepeoplesearch.com/resultphone?phoneno='+encodeURIComponent(p),'_blank')}</script></body></html>
